<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>kanban-Board</title>
    <style>body{background-color:#f4f6f9;margin:0;padding:20px;font-family:Arial,sans-serif}.kanban-app{max-width:1000px;margin:0 auto}#todo-form{gap:10px;margin-bottom:30px;display:flex}#todo-form input{border:1px solid #ccc;border-radius:6px;flex-grow:1;padding:10px}#todo-form button{color:#fff;cursor:pointer;background-color:#3498db;border:none;border-radius:6px;padding:10px 20px}.kanban-board{justify-content:space-between;gap:20px;display:flex}.column{background-color:#ebecf0;border-radius:8px;flex-direction:column;flex:1;padding:15px;display:flex}.column h2{color:#333;border-bottom:2px solid #ddd;margin-top:0;margin-bottom:10px;padding-bottom:8px;font-size:18px}.task-card{cursor:grab;background-color:#fff;border-radius:6px;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;padding:12px;transition:transform .1s;display:flex;box-shadow:0 2px 4px #0000000d}.task-card:hover{transform:translateY(-2px);box-shadow:0 4px 8px #0000001a}.task-card:active{cursor:grabbing}.delete-btn{color:#e74c3c;cursor:pointer;background:0 0;border:none;border-radius:4px;padding:0 5px;font-size:20px;line-height:1;transition:background-color .2s,color .2s}.delete-btn:hover{color:#c0392b;background-color:#fce4e4}#todo-list,#progress-list,#done-list{box-sizing:border-box;background-color:#00000005;border:1px dashed #ccc;border-radius:8px;flex-grow:1;min-height:400px;padding:10px}</style>
  <script type="module" crossorigin src="/kanban-board/assets/index-Dq-uChSQ.js"></script>
</head>
<body>
    <div class="kanban-app">
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="What needs to be done?" required>

            <button type="submit">Add Task</button>
        </form>
        <div class="kanban-board">
            <div class="column">
                <h2>Backlog</h2>
                <div class="task-list" id="todo-list"></div>
            </div>

            <div class="column">
                <h2>In Progress</h2>
                <div class="task-list" id="progress-list"></div>
            </div>

            <div class="column">
                <h2>Done</h2>
                <div class="task-list" id="done-list"></div>
            </div>
        </div>
    </div>
</body>
</html>
